[project]
name = "campusai-evidence-rag"
version = "0.1.0"
description = "CampusAI evidence-grounded RAG for university knowledge"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pandas>=2.2,<3.0", "pdfplumber>=0.11,<1.0", "pymupdf>=1.24,<2.0", "pyyaml>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]
ocr = ["pytesseract>=0.3.13,<1.0", "pillow>=10.0,<13.0", "rapidocr-onnxruntime>=1.4,<2.0", "numpy>=2.0,<3.0"]
pdf-repair = ["pikepdf>=9.0,<11.0"]
parquet = ["pyarrow>=15,<21"]
feasibility = [
  "docling>=2.0,<3.0",
  "fastembed>=0.3,<1.0",
  "sentence-transformers>=3.0,<6.0",
  "psutil>=5.9,<8.0",
  "torch>=2.2,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Let pytest create an isolated temporary directory per invocation. A fixed
# basetemp is unsafe on Windows when a worker or native PDF handle survives
# teardown and prevents the next run from cleaning the directory.
addopts = "-ra -p no:cacheprovider"
[tool.coverage.run]
source = ["src/campusai/llm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
