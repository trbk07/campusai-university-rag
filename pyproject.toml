[project]
name = "adaptive-rag-financial-business-reports"
version = "0.1.0"
description = "Adaptive RAG for financial and business reports"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pandas>=2.2,<3.0", "pyarrow>=15,<20", "pdfplumber>=0.11,<1.0", "pymupdf>=1.24,<2.0", "pyyaml>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]
ocr = ["pytesseract>=0.3.13,<1.0", "pillow>=10.0,<13.0"]
pdf-repair = ["pikepdf>=9.0,<11.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/finrag/llm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

