# Opt-in only: operator must confirm three independent Google projects.
# Same model, prompts and conservative shared budget; zero retries.
# Project 429 cooldowns are separate; provider-wide 503 still blocks all keys.
llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  api_key_env: GEMINI_API_KEY
  timeout_seconds: 20
  max_retries: 0
  json_mode: native
  overload_circuit_path: data/operations/gemini-provider-health.sqlite3
  requests_per_minute: 10
  cache_path: ':memory:'
  quota:
    state_path: data/operations/flash-lite-quota.sqlite3
    scope: gemini:owner:gemini-3.5-flash-lite
    max_in_flight: 1
    max_wait_seconds: 6
  generation_config:
    temperature: 1
    maxOutputTokens: 1536
    thinkingConfig:
      thinkingLevel: minimal
  api_key_envs:
  - GEMINI_API_KEY
  - GEMINI_API_KEY_2
  - GEMINI_API_KEY_3
  independent_projects: true
rag:
  context_candidates: 8
  max_context_chars: 8000
  balanced_context: true
  source_citations: true
