# Free-only candidate on the owner's existing Google API credential.
# This is not an assertion of account quota or an activated product default.
llm:
  provider: gemini
  model: gemma-4-31b-it
  api_key_env: GEMINI_API_KEY
  timeout_seconds: 20
  max_retries: 0
  json_mode: prompt
  overload_circuit_path: data/operations/gemma4-provider-health.sqlite3
  requests_per_minute: 3
  cache_path: ':memory:'
  quota:
    state_path: data/operations/gemma4-quota.sqlite3
    scope: gemini:owner:gemma-4-31b-it
    max_in_flight: 1
    max_wait_seconds: 20
  generation_config:
    temperature: 0.2
    maxOutputTokens: 1536
    thinkingConfig:
      thinkingLevel: minimal
