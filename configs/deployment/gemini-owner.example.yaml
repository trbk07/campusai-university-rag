# Copy outside the release to /etc/campusai/llm.yaml after quota verification.
# requests_per_minute must equal min(operator cap, verified account RPM).
# Never add a key here: only the service environment contains GEMINI_API_KEY.
llm:
  provider: gemini
  model: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  timeout_seconds: 15
  max_retries: 0
  cache_path: ':memory:'
  overload_circuit_path: /var/lib/campusai/operations/gemini-provider-health.sqlite3
  requests_per_minute: 5
  # EXAMPLE limits: replace with min(operator cap, verified Free Tier quota).
  # All owner workers/credentials sharing quota must use this file and scope.
  quota:
    state_path: /var/lib/campusai/operations/gemini-quota.sqlite3
    scope: gemini:owner:gemini-3.8-flash
    input_tokens_per_minute: 20000
    requests_per_day: 100
    total_tokens_per_day: 200000
    max_in_flight: 1
    max_wait_seconds: 2
  generation_config:
    temperature: 1
    maxOutputTokens: 1024
    thinkingConfig:
      thinkingLevel: low
