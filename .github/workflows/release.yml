name: Release container
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
  deploy:
    needs: publish
    if: vars.CAMPUSAI_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, campusai]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: campusai-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify deployment prerequisites
        shell: bash
        env:
          DEPLOY_ENV: ${{ vars.CAMPUSAI_DEPLOY_ENV_FILE }}
        run: |
          test -n "$DEPLOY_ENV" && test "${DEPLOY_ENV:0:1}" = / && test -f "$DEPLOY_ENV"
          docker compose version
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy tested immutable image
        shell: bash
        env:
          CAMPUSAI_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          DEPLOY_ENV: ${{ vars.CAMPUSAI_DEPLOY_ENV_FILE }}
        run: |
          docker compose --env-file "$DEPLOY_ENV" pull app
          previous_container=$(docker compose --env-file "$DEPLOY_ENV" ps -q app)
          previous_image=''
          if [ -n "$previous_container" ]; then
            previous_image=$(docker inspect --format '{{.Image}}' "$previous_container")
          fi
          if ! docker compose --env-file "$DEPLOY_ENV" up -d --no-build --wait --wait-timeout 180 app; then
            if [[ "$previous_image" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              CAMPUSAI_IMAGE="$previous_image" docker compose --env-file "$DEPLOY_ENV" up -d --no-build --pull never --wait --wait-timeout 180 app
            fi
            exit 1
          fi
